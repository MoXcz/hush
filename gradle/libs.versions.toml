[versions]
app-minSdk = "26"
app-compileSdk = "37"
app-targetSdk = "37"
app-versionCode = "3"
app-versionName = "1.0.0"

agp = "9.4.1"
kotlin = "2.4.21"
composeMultiplatform = "1.12.2"
composeMaterial3 = "1.12.0-alpha03"
lifecycle = "2.11.0"
navigation3 = "1.1.2"
coroutines = "1.11.0"
koinBom = "4.2.2"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
datastore = "1.3.0"
ksp = "2.3.12"
